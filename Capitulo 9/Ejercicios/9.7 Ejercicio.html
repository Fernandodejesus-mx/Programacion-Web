<!DOCTYPE html>
<!-- Ejercicio 9.7: areaCirculo.html -->
<html>
<head>
<meta charset="utf-8">
<title>Ejercicio 9.7</title>
<style>body{font-family:Arial,sans-serif;max-width:700px;margin:30px auto;padding:0 16px}</style>
<script>
  function iniciar() {
    document.getElementById("botonCalcular").addEventListener("click", mostrarArea, false);
  }

  function mostrarArea() {
    var radio = parseFloat(document.getElementById("campoRadio").value);
    document.getElementById("resultado").innerHTML =
      "El área del círculo es: " + areaCirculo(radio);
  }

  function areaCirculo(radio) {
    return Math.PI * Math.pow(radio, 2);
  }

  window.addEventListener("load", iniciar, false);
</script>
</head>
<body>
  <h2>9.7 Área de un círculo</h2>
  <form action="#">
    <p><label>Radio: <input id="campoRadio" type="number" step="any"></label>
    <input id="botonCalcular" type="button" value="Calcular"></p>
  </form>
  <p id="resultado"></p>
  <p><a href="../index.html">&#8592; Volver a selección de Ejercicios</a></p>
</body>
</html>
