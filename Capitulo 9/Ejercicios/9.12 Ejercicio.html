<!DOCTYPE html>
<!-- Ejercicio 9.12: conjuntos.html -->
<html>
<head>
<meta charset="utf-8">
<title>Ejercicio 9.12</title>
<style>
  body{font-family:Arial,sans-serif;max-width:700px;margin:30px auto;padding:0 16px}
  table{border-collapse:collapse;width:100%}
  td,th{border:1px solid #ccc;padding:6px 10px;text-align:left}
  code{font-family:Consolas,monospace}
</style>
<script>
  function generar() {
    var filas = "";
    var casos = [
      ["a) 2, 4, 6, 8, 10",   "document.writeln( 2 + 2 * Math.floor( Math.random() * 5 ) );",
        function(){ return 2 + 2 * Math.floor( Math.random() * 5 ); }],
      ["b) 3, 5, 7, 9, 11",   "document.writeln( 3 + 2 * Math.floor( Math.random() * 5 ) );",
        function(){ return 3 + 2 * Math.floor( Math.random() * 5 ); }],
      ["c) 6, 10, 14, 18, 22","document.writeln( 6 + 4 * Math.floor( Math.random() * 5 ) );",
        function(){ return 6 + 4 * Math.floor( Math.random() * 5 ); }]
    ];

    for (var i = 0; i < casos.length; i++) {
      filas += "<tr><td>" + casos[i][0] + "</td><td><code>" + casos[i][1] +
               "</code></td><td>" + casos[i][2]() + "</td></tr>";
    }
    document.getElementById("cuerpo").innerHTML = filas;
  }

  window.addEventListener("load", function () {
    generar();
    document.getElementById("boton").addEventListener("click", generar, false);
  }, false);
</script>
</head>
<body>
  <h2>9.12 Número al azar de un conjunto</h2>
  <table>
    <thead><tr><th>Conjunto</th><th>Instrucción</th><th>Resultado</th></tr></thead>
    <tbody id="cuerpo"></tbody>
  </table>
  <p><input id="boton" type="button" value="Generar de nuevo"></p>
  <p><a href="../index.html">&#8592; Volver a selección de Ejercicios</a></p>
</body>
</html>
