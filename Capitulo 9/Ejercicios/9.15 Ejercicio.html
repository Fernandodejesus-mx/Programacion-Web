<!DOCTYPE html>
<!-- Ejercicio 9.15: esPar.html -->
<html>
<head>
<meta charset="utf-8">
<title>Ejercicio 9.15</title>
<style>body{font-family:Arial,sans-serif;max-width:700px;margin:30px auto;padding:0 16px}</style>
<script>
  function esPar(numero) {
    return numero % 2 === 0;
  }

  function iniciar() {
    var centinela = -1;
    var texto = prompt("Introduzca un entero (-1 para terminar):", "0");
    var numero = parseInt(texto);

    while (numero !== centinela && !isNaN(numero)) {
      document.getElementById("salida").innerHTML +=
        "<p>" + numero + (esPar(numero) ? " es par" : " es impar") + "</p>";

      texto = prompt("Introduzca otro entero (-1 para terminar):", "0");
      numero = parseInt(texto);
    }
  }

  window.addEventListener("load", iniciar, false);
</script>
</head>
<body>
  <h2>9.15 ¿Es par?</h2>
  <div id="salida"></div>
  <p><a href="../index.html">&#8592; Volver a selección de Ejercicios</a></p>
</body>
</html>
