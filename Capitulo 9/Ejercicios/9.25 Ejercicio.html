<!DOCTYPE html>
<!-- Ejercicio 9.25: adivinar.html -->
<html>
<head>
<meta charset="utf-8">
<title>Ejercicio 9.25</title>
<style>body{font-family:Arial,sans-serif;max-width:700px;margin:30px auto;padding:0 16px}</style>
<script>
  var secreto;

  function nuevoJuego() {
    secreto = 1 + Math.floor(Math.random() * 1000);
  }

  function enviar() {
    var campo = document.getElementById("intento");
    var intento = parseInt(campo.value);
    var mensaje;

    if (isNaN(intento)) {
      mensaje = "Introduzca un número.";
    } else if (intento > secreto) {
      mensaje = "Demasiado alto. Intente de nuevo.";
    } else if (intento < secreto) {
      mensaje = "Demasiado bajo. Intente de nuevo.";
    } else {
      mensaje = "Felicidades. ¡Adivinó el número!";
      nuevoJuego();
    }

    document.getElementById("mensaje").innerHTML = mensaje;
    campo.value = "";
  }

  function iniciar() {
    document.getElementById("boton").addEventListener("click", enviar, false);
    nuevoJuego();
  }

  window.addEventListener("load", iniciar, false);
</script>
</head>
<body>
  <h2>9.25 Adivine el número</h2>
  <form action="#">
    <p><label>Adivine un número entre 1 y 1000: <input id="intento" type="number"></label>
    <input id="boton" type="button" value="Enviar"></p>
  </form>
  <p id="mensaje"></p>
  <p><a href="../index.html">&#8592; Volver a selección de Ejercicios</a></p>
</body>
</html>
