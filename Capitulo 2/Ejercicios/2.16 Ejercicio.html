<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Retroalimentación sobre la visita al campus</title>
</head>
<body>
    <h1>Formulario de retroalimentación para futuros estudiantes</h1>

    <form action="http://www.deitel.com" method="post">

        <p>
            Nombre: <input type="text" name="nombre">
        </p>

        <p>
            Correo electrónico: <input type="email" name="correo">
        </p>

        <p><strong>¿Qué fue lo que más le gustó del campus?</strong></p>
        <p>
            <input type="checkbox" name="gusto" value="campus" id="c1">
            <label for="c1">Campus</label><br>

            <input type="checkbox" name="gusto" value="ubicacion" id="c2">
            <label for="c2">Ubicación</label><br>

            <input type="checkbox" name="gusto" value="ambiente" id="c3">
            <label for="c3">Ambiente</label><br>

            <input type="checkbox" name="gusto" value="dormitorios" id="c4">
            <label for="c4">Dormitorios</label><br>

            <input type="checkbox" name="gusto" value="deportes" id="c5">
            <label for="c5">Deportes</label>
        </p>

        <p><strong>¿Cómo supo sobre la universidad?</strong></p>
        <p>
            <input type="radio" name="referencia" value="amigos" id="r1">
            <label for="r1">Amigos</label><br>

            <input type="radio" name="referencia" value="television" id="r2">
            <label for="r2">Televisión</label><br>

            <input type="radio" name="referencia" value="internet" id="r3">
            <label for="r3">Internet</label><br>

            <input type="radio" name="referencia" value="otro" id="r4">
            <label for="r4">Otro</label>
        </p>

        <p>
            Comentarios adicionales:<br>
            <textarea name="comentarios" rows="5" cols="40"></textarea>
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Restablecer">
        </p>

    </form>
    <p><a href="../index.html">&#8592; Volver a selección de Ejercicios</a></p>
</body>
</html>
