<!DOCTYPE html>
<html>

<head>
    <title>Una tabla de HTML5 simple</title>
</head>

<body>

    <table border="1">


        <caption><strong>Tabla de frutas (lera columna) y
                sus precios (2da columna)</strong></caption>

        <thead><tr>
            <th>Fruta</th>
            <th>Precio</th>
            </tr>
        </thead>


        <tfoot>
            <tr>
                <th>Total</th>
                <th>$3.75</th>
            </tr>
        </tfoot>

        <tbody>
            <tr>
                <td>Manzana</td>
                <td>$0.25</td>
            </tr>
            <tr>
                <td>Naranja</td>
                <td>$0.50</td>
            <tr>
            <tr>
                <td>Platano</td>
                <td>$1.00</td>
            </tr>
            <tr>
                <td>Piña</td>
                <td>$2.00</td>
            </tr>
        </tbody>
    </table>
    <p><a href="../index.html">&#8592; Volver a selección de Ejemplos</a></p>
</body>

</html>
