<!DOCTYPE html>

<!-- Fig. 10.13: PasoArreglo.html -->
<!-- Documento de HTML que demuestra el paso de arreglos y -->
<!-- elementos individuales de arreglos a funciones. -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Arreglos como argumentos</title>
   </head>
   <body>
      <h2>Efectos de pasar un arreglo completo por referencia</h2>
      <p id = "arregloOriginal"></p>
      <p id = "arregloModificado"></p>
      <h2>Efectos de pasar el elemento de un arreglo por valor</h2>
      <p id = "elementoOriginal"></p>
      <p id = "enModificarElemento"></p>
      <p id = "elementoModificado"></p>

      <script>
         var a = [ 1, 2, 3, 4, 5 ];

         function iniciar()
         {
            var elementoSalida = document.getElementById( "arregloOriginal" );
            elementoSalida.innerHTML = "Arreglo original: " + a.join( " " );

            modificarArreglo( a ); // el arreglo se pasa por referencia

            elementoSalida = document.getElementById( "arregloModificado" );
            elementoSalida.innerHTML = "Arreglo modificado: " + a.join( " " );

            elementoSalida = document.getElementById( "elementoOriginal" );
            elementoSalida.innerHTML = "a[3] antes de modificarElemento: " + a[ 3 ];

            modificarElemento( a[ 3 ] ); // el elemento se pasa por valor

            elementoSalida = document.getElementById( "elementoModificado" );
            elementoSalida.innerHTML = "a[3] después de modificarElemento: " + a[ 3 ];
         } // fin de la función iniciar

         // multiplica por 2 cada elemento del arreglo
         function modificarArreglo( elementos )
         {
            for ( var i = 0; i < elementos.length; ++i )
               elementos[ i ] *= 2;
         } // fin de la función modificarArreglo

         // multiplica por 2 un solo valor
         function modificarElemento( e )
         {
            e *= 2;
            document.getElementById( "enModificarElemento" ).innerHTML =
               "Valor en modificarElemento: " + e;
         } // fin de la función modificarElemento

         window.addEventListener( "load", iniciar, false );
      </script>
   </body>
</html>
