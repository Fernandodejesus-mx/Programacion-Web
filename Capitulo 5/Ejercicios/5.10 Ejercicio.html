<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Inclinación</title>
<style>
body {
  font-family: "Times New Roman", Times, serif;
  padding: 100px;
}
#caja {
  width: 200px;
  height: 120px;
  line-height: 120px;
  text-align: center;
  font-size: 1.6em;
  background-color: lightgray;
  border: 2px solid black;
  border-radius: 15px;
  animation-name: inclinar;
  animation-duration: 6s;
  animation-timing-function: ease-in-out;
  animation-iteration-count: infinite;
}
@keyframes inclinar {
  0%   { transform: skew(0deg, 0deg); }
  25%  { transform: skewY(30deg); }
  50%  { transform: skew(0deg, 0deg); }
  75%  { transform: skewX(30deg); }
  100% { transform: skew(0deg, 0deg); }
}
</style>
</head>
<body>
    <p><a href="../index.html">&#8592; Volver a selección de Ejercicios</a></p>
<div id="caja">Inclinar texto</div>
</body>
</html>
