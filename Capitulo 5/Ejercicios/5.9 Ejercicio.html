<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Animación en patrón cuadrado</title>
<style>
body {
  font-family: Arial, Helvetica, sans-serif;
  padding: 40px;
}
#cuadro {
  width: 60px;
  height: 60px;
  background-color: tomato;
  border: 3px solid black;
  position: relative;
  animation-name: moverCuadrado;
  animation-duration: 8s;
  animation-timing-function: linear;
  animation-iteration-count: infinite;
}
@keyframes moverCuadrado {
  0%   { left: 0;     top: 0; }
  25%  { left: 300px; top: 0; }
  50%  { left: 300px; top: 300px; }
  75%  { left: 0;     top: 300px; }
  100% { left: 0;     top: 0; }
}
</style>
</head>
<body>
    <p><a href="../index.html">&#8592; Volver a selección de Ejercicios</a></p>
<div id="cuadro"></div>
</body>
</html>
