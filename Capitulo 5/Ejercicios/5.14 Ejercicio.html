<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Transformación con hover</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
      padding: 30px;
    }

    .galeria {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-top: 50px;
    }

    .galeria img {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border: 2px solid #333;
      border-radius: 8px;
      transition: transform 0.4s;
    }

    .galeria img:hover {
      transform: scale(1.2);
    }
  </style>
</head>

<body>

  <h1>Pasa el ratón sobre cada imagen</h1>

  <div class="galeria">
    <img src="imagenes/amanecer.png" alt="amanecer">
    <img src="imagenes/dia.png" alt="dia">
    <img src="imagenes/anochecer.png" alt="anochecer">
    <img src="imagenes/noche.png" alt="noche">
  </div>
  <p><a href="../index.html">&#8592; Volver a selección de Ejercicios</a></p>
</body>

</html>
