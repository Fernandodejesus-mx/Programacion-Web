<body>
    <h1>Ejercicio 6.15 - Números del 1 al 4</h1>

    <h3>a) Con una instrucción document.writeln</h3>
    <script>
        document.writeln("<p>1 2 3 4</p>");
    </script>
    <pre>document.writeln( "&lt;p&gt;1 2 3 4&lt;/p&gt;" );</pre>
    <h3>b) Con cuatro instrucciones document.write</h3>
    <script>
        document.write("<p>1 ");
        document.write("2 ");
        document.write("3 ");
        document.write("4</p>");
    </script>
    <pre>document.write( "&lt;p&gt;1 " );
document.write( "2 " );
document.write( "3 " );
document.write( "4&lt;/p&gt;" );</pre>
