<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <title>Ejercicio 6.21 - Par o impar</title>
    <script>
        var valor, numero;

        valor = window.prompt("Introduzca un entero", "0");
        numero = parseInt(valor);

        if (numero % 2 == 0)
            document.writeln("<h1>El número " + numero + " es par</h1>");

        if (numero % 2 != 0)
            document.writeln("<h1>El número " + numero + " es impar</h1>");
    </script>
</head>

<body><p><a href="../index.html">&#8592; Volver a selección de Ejercicios</a></p></body>

</html>
