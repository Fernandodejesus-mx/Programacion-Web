<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ejercicio 6.6 - Producto de tres enteros</title>
<script>
   // Este programa calcula el producto de tres enteros
   var x, y, z, resultado;
   var xVal, yVal, zVal;

   xVal = window.prompt( "Introduzca el primer valor:", "0" );
   yVal = window.prompt( "Introduzca el segundo valor:", "0" );
   zVal = window.prompt( "Introduzca el tercer valor:", "0" );

   x = parseInt( xVal );
   y = parseInt( yVal );
   z = parseInt( zVal );

   resultado = x * y * z;

   document.writeln( "<h1>El producto es " + resultado + "</h1>" );
</script>
</head>
<body>
   <p><a href="../index.html">&#8592; Volver a selección de Ejercicios</a></p>
</body>
</html>
