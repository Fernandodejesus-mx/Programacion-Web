<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <title>Ejercicio 6.17 - Número mayor</title>
    <script>
        var primerNumero, segundoNumero, numero1, numero2;

        primerNumero = window.prompt("Introduzca el primer entero", "0");
        segundoNumero = window.prompt("Introduzca el segundo entero", "0");

        numero1 = parseInt(primerNumero);
        numero2 = parseInt(segundoNumero);

        if (numero1 > numero2)
            window.alert(numero1 + " es mayor que " + numero2);

        if (numero2 > numero1)
            window.alert(numero2 + " es mayor que " + numero1);

        if (numero1 == numero2)
            document.writeln("<h1>Estos números son iguales</h1>");
    </script>
</head>

<body>
    <p><a href="../index.html">&#8592; Volver a selección de Ejercicios</a></p>
</body>

</html>
