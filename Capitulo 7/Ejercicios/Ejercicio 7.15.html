<!DOCTYPE html>


<html lang="es">
<head>
   <meta charset="utf-8">
   <title>El número mayor</title>
   <script>

      var contador = 1; // cuenta cuántos números se han introducido
      var numero;       // el entero más reciente introducido por el usuario
      var mayor;        // el número más grande encontrado hasta ahora

      // el primer número es el mayor hasta ahora
      numero = parseInt(
         window.prompt( "Escriba el número 1 (un solo dígito):", "0" ) );
      mayor = numero;

      // procesar los 9 números restantes
      while ( contador < 10 )
      {
         contador = contador + 1;

         numero = parseInt(
            window.prompt( "Escriba el número " + contador +
               " (un solo dígito):", "0" ) );

         if ( numero > mayor )
            mayor = numero;
      } // fin de while

      document.writeln( "<h1>El número más grande es " + mayor + "</h1>" );

   </script>
</head>
<body><p><a href="../index.html">&#8592; Volver a selección de Ejercicios</a></p></body>
</html>
