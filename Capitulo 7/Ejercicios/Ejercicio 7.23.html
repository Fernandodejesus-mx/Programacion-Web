<!DOCTYPE html>

<html lang="es">
<head>
   <meta charset="utf-8">
   <title>Descifrar un entero de cuatro dígitos</title>
   <script>

      var numero; 
      var c1, c2, c3, c4; 
      var d1, d2, d3, d4; 

      numero = parseInt(
         window.prompt( "Escriba el entero cifrado de cuatro dígitos:", "0" ) );

      while ( !( numero >= 0 && numero <= 9999 ) )
      {
         window.alert( "Debe escribir un entero de cuatro dígitos." );
         numero = parseInt(
            window.prompt( "Escriba el entero cifrado de cuatro dígitos:", "0" ) );
      } // fin de while

      // separar los dígitos
      c1 = Math.floor( numero / 1000 );
      c2 = Math.floor( numero / 100 ) % 10;
      c3 = Math.floor( numero / 10 ) % 10;
      c4 = numero % 10;

      // deshacer el intercambio y deshacer el reemplazo
      // ( dígito + 7 ) % 10 se revierte con ( dígito + 3 ) % 10
      d1 = ( c3 + 3 ) % 10;
      d2 = ( c4 + 3 ) % 10;
      d3 = ( c1 + 3 ) % 10;
      d4 = ( c2 + 3 ) % 10;

      document.writeln( "<h1>Número original: " + d1 + d2 + d3 + d4 + "</h1>" );

   </script>
</head>
<body><p><a href="../index.html">&#8592; Volver a selección de Ejercicios</a></p></body>
</html>
