<!DOCTYPE html>

<html lang="es">
<head>
   <meta charset="utf-8">
   <title>Tabla de valores</title>
   <style>
      table, th, td { border: 1px solid gray; }
      table { border-collapse: separate; }
      th, td { text-align: center; padding: 2px 6px; }
   </style>
   <script>

      var n = 1; 

      document.writeln( "<table>" );
      document.writeln( "<thead><tr><th>N</th><th>10*N</th>" +
         "<th>100*N</th><th>1000*N</th></tr></thead>" );
      document.writeln( "<tbody>" );

      while ( n <= 10 )
      {
         document.writeln( "<tr><td>" + n + "</td><td>" + 10 * n +
            "</td><td>" + 100 * n + "</td><td>" + 1000 * n + "</td></tr>" );
         n = n + 1;
      } 

      document.writeln( "</tbody>" );
      document.writeln( "</table>" );

   </script>
</head>
<body><p><a href="../index.html">&#8592; Volver a selección de Ejercicios</a></p></body>
</html>
