<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <title>Ejercicio 8.7 - Producto de los impares del 1 al 15</title>
    <script>
        var producto = 1;
        var numero;

        for (numero = 1; numero <= 15; numero += 2)
            producto *= numero;

        document.writeln("<h1>El producto de los enteros impares del 1 al 15 es " + producto + "</h1>");
    </script>
</head>

</html>
