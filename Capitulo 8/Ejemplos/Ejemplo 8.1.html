<!DOCTYPE html>

<html>
   <head>
      <meta charset = "utf-8">
      <title>Repetici&oacute;n controlada por contador</title>
      <script>

         var contador = 1; // inicialización

         while ( contador <= 7 ) // condición de repetición
         {
            document.writeln( "<p style = 'font-size: " +
               contador + "ex'>Tama&ntilde;o de fuente de HTML5 " + contador + "ex</p>" );
            ++contador; // incremento
         } // fin de while

      </script>
   </head><body><p><a href="../index.html">&#8592; Volver a selección de Ejemplos</a></p>
</body>
</html>
