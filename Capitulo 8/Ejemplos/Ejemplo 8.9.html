<!DOCTYPE html>

<html>
   <head>
      <meta charset = "utf-8">
      <title>Uso de la instrucción de repetición do...while</title>
      <script>

         var contador = 1;

         do {
            document.writeln( "<h" + contador + ">&Eacute;ste es " +
               "un encabezado de nivel h" + contador + "</h" +
               contador + ">" );
            ++contador;
         } while ( contador <= 6 );

      </script>

   </head><body><p><a href="../index.html">&#8592; Volver a selección de Ejemplos</a></p>
</body>
</html>
