<!DOCTYPE html>

<html>
   <head>
      <meta charset = "utf-8">
      <title>
         Uso de la instrucci&oacute;n break en una instrucci&oacute;n for
      </title>
      <script>

         for ( var cuenta = 1; cuenta <= 10; ++cuenta )
         {
            if ( cuenta == 5 )
               break;

            document.writeln( cuenta + " " );
         } //fin de for

         document.writeln(
            "<p>Se interrumpi&oacute; el ciclo en cuenta = " + cuenta + "</p>" );

      </script>
   </head><body><p><a href="../index.html">&#8592; Volver a selección de Ejemplos</a></p>
</body>
</html>
