<!DOCTYPE html>
<html>


<head>
    <meta charset="utf-8">
    <title>Menú desplegable</title>

    <style type="text/css">

        ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
        }

        li {
            position: relative;
            width: 120px;
        }

        li ul {
            display: none;
            position: absolute;
            left: 0;
            top: 100%;
            padding: 0;
            margin: 0;
        }

        li:hover ul {
            display: block;
        }

        a {
            display: block;
            padding: 5px;
            text-decoration: none;
            background-color: white;
            color: black;
        }

        a:hover {
            background-color: lightgray;
        }

    </style>
</head>

</body>
</html>
