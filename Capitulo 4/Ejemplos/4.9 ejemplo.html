<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Bordes</title>

    <style>
        p {
            text-align: center;
            width: 50%;
            position: relative;
            left: 25%;
        }

        .thick {
            border-width: thick;
        }

        .medium {
            border-width: medium;
        }

        .thin {
            border-width: thin;
        }

        .solid {
            border-style: solid;
        }

        .double {
            border-style: double;
        }

        .groove {
            border-style: groove;
        }

        .ridge {
            border-style: ridge;
        }

        .dotted {
            border-style: dotted;
        }

        .inset {
            border-style: inset;
        }

        .outset {
            border-style: outset;
        }

        .dashed {
            border-style: dashed;
        }

        .red {
            border-color: red;
        }

        .blue {
            border-color: blue;
        }
    </style>
</head>

<body>

    <p class="thick solid">Borde sólido</p>

    <p class="thick double">Doble borde</p>

    <p class="thick groove">Borde acanalado</p>

    <p class="thick ridge">Borde rugoso</p>

    <p class="thick dotted">Borde punteado</p>

    <p class="thick inset">Borde incrustado</p>

    <p class="thick outset">Borde saliente</p>

    <p class="thick dashed">Borde grueso intermitente</p>

    <p class="thin solid red">Borde sólido rojo delgado</p>

    <p class="medium outset blue">Borde saliente azul mediano</p>
    <p><a href="../index.html">&#8592; Volver a selección de Ejemplos</a></p>

</body>
</html>
