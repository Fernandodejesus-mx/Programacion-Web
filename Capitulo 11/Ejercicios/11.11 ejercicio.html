<!DOCTYPE html>

<!-- Ejercicio 11.11 -->
<html lang="es">
<head>
   <meta charset="utf-8">
   <title>Ejercicio 11.11</title>
   <style>
      body { font-family: Arial, sans-serif; max-width: 820px; margin: 20px auto; padding: 0 16px; line-height: 1.5; }
      .enunciado { background: #f4f4f4; border-left: 4px solid #888; padding: 8px 14px; }
      textarea { width: 100%; box-sizing: border-box; font-family: monospace; }
      input[type="text"], input[type="number"], input[type="date"] { padding: 4px; margin: 2px 0; }
      button, input[type="button"] { padding: 5px 12px; margin: 2px 0; cursor: pointer; }
      .resultado { background: #eef6ee; padding: 6px 12px; margin-top: 8px; }
      li { margin-bottom: 6px; }
      b.resp { color: #0a5; }
   </style>
</head>
<body>
   <h1>Ejercicio 11.11</h1>
   <div class="enunciado">Escriba una secuencia de comandos que reciba como entrada una línea de texto, que divida la línea en tokens mediante el método <code>split</code> de <code>String</code> y que muestre los tokens en orden inverso.</div>
   <form action="#">
      <p>Línea de texto: <input type="text" id="linea" size="50">
         <input type="button" id="btnInvertir" value="Mostrar tokens al revés"></p>
   </form>
   <textarea id="salida" rows="10" readonly></textarea>
   <p><a href="../index.html">&#8592; Volver a selección de Ejercicios</a></p>
   <script>
function invertir() {
   var tokens = document.getElementById("linea").value.split(" ");
   var salida = "";
   for (var i = tokens.length - 1; i >= 0; --i) {
      if (tokens[i] !== "") salida += tokens[i] + "\n";
   }
   document.getElementById("salida").value = salida;
}
window.addEventListener("load", function () {
   document.getElementById("btnInvertir").addEventListener("click", invertir, false);
}, false);
   </script>
</body>
</html>
