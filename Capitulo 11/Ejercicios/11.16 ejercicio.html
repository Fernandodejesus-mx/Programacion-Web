<!DOCTYPE html>

<!-- Ejercicio 11.16 -->
<html lang="es">
<head>
   <meta charset="utf-8">
   <title>Ejercicio 11.16</title>
   <style>
      body { font-family: Arial, sans-serif; max-width: 820px; margin: 20px auto; padding: 0 16px; line-height: 1.5; }
      .enunciado { background: #f4f4f4; border-left: 4px solid #888; padding: 8px 14px; }
      textarea { width: 100%; box-sizing: border-box; font-family: monospace; }
      input[type="text"], input[type="number"], input[type="date"] { padding: 4px; margin: 2px 0; }
      button, input[type="button"] { padding: 5px 12px; margin: 2px 0; cursor: pointer; }
      .resultado { background: #eef6ee; padding: 6px 12px; margin-top: 8px; }
      li { margin-bottom: 6px; }
      b.resp { color: #0a5; }
   </style>
</head>
<body>
   <h1>Ejercicio 11.16</h1>
   <div class="enunciado">Escriba una secuencia de comandos que lea una serie de cadenas e imprima en un elemento <code>textarea</code> de HTML5 sólo aquellas cadenas que terminen con los caracteres “ed”.</div>
   <form action="#">
      <p>Escriba una serie de cadenas, una por línea:</p>
      <textarea id="entrada" rows="8">played
house
red
walked
bed
car</textarea>
      <p><input type="button" id="btnFiltrar" value="Filtrar"></p>
   </form>
   <p>Cadenas que terminan con “ed”:</p>
   <textarea id="salida" rows="8" readonly></textarea>
   <p><a href="../index.html">&#8592; Volver a selección de Ejercicios</a></p>
   <script>
function filtrar() {
   var cadenas = document.getElementById("entrada").value.split("\n");
   var salida = "";
   for (var i = 0; i < cadenas.length; ++i) {
      var s = cadenas[i].trim();
      if (s.length >= 2 && s.substring(s.length - 2) === "ed") salida += s + "\n";
   }
   document.getElementById("salida").value = salida;
}
window.addEventListener("load", function () {
   document.getElementById("btnFiltrar").addEventListener("click", filtrar, false);
}, false);
   </script>
</body>
</html>
