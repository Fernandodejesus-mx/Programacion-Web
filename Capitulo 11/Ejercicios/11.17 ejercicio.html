<!DOCTYPE html>

<!-- Ejercicio 11.17 -->
<html lang="es">
<head>
   <meta charset="utf-8">
   <title>Ejercicio 11.17</title>
   <style>
      body { font-family: Arial, sans-serif; max-width: 820px; margin: 20px auto; padding: 0 16px; line-height: 1.5; }
      .enunciado { background: #f4f4f4; border-left: 4px solid #888; padding: 8px 14px; }
      textarea { width: 100%; box-sizing: border-box; font-family: monospace; }
      input[type="text"], input[type="number"], input[type="date"] { padding: 4px; margin: 2px 0; }
      button, input[type="button"] { padding: 5px 12px; margin: 2px 0; cursor: pointer; }
      .resultado { background: #eef6ee; padding: 6px 12px; margin-top: 8px; }
      li { margin-bottom: 6px; }
      b.resp { color: #0a5; }
   </style>
</head>
<body>
   <h1>Ejercicio 11.17</h1>
   <div class="enunciado">Escriba una secuencia de comandos que reciba como entrada un código entero para un carácter y que muestre el carácter correspondiente.</div>
   <form action="#">
      <p>Código entero: <input type="number" id="codigo" min="0" max="65535" value="65">
         <input type="button" id="btnMostrar" value="Mostrar carácter"></p>
   </form>
   <div id="resultados"></div>
   <p><a href="../index.html">&#8592; Volver a selección de Ejercicios</a></p>
   <script>
function mostrar() {
   var codigo = parseInt(document.getElementById("codigo").value, 10);
   if (isNaN(codigo) || codigo < 0 || codigo > 65535) { alert("Introduzca un entero entre 0 y 65535."); return; }
   var r = document.getElementById("resultados");
   r.innerHTML = '<div class="resultado"></div>';
   r.firstChild.textContent = "El carácter con código " + codigo + " es: '" + String.fromCharCode(codigo) + "'";
}
window.addEventListener("load", function () {
   document.getElementById("btnMostrar").addEventListener("click", mostrar, false);
}, false);
   </script>
</body>
</html>
